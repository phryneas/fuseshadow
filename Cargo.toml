[package]
name = "fuseshadow"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "fuseshadow"
path = "src/main.rs"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
ignore = "0.4"
serde = { version = "1", features = ["derive"] }
toml = "0.8"
walkdir = "2"
fuser = "0.15"
libc = "0.2"

[dev-dependencies]
tempfile = "3"

[lints.rust]
unused = "warn"

[lints.clippy]
all = "warn"
