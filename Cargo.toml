[package]
name = "fuseshadow"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "fuseshadow"
path = "src/main.rs"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
ignore = "0.4"
serde = { version = "1", features = ["derive"] }
tempfile = "3"
toml = "0.8"
walkdir = "2"
# fuser and libc added in Phase 2 (requires macFUSE / FUSE3 at link time)

[lints.rust]
unused = "warn"

[lints.clippy]
all = "warn"
