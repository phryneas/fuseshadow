[build]
# fuseshadow is Linux-only (FUSE). Pin the target so that cargo check,
# clippy, and IDE analysis (rust-analyzer / IntelliJ) always resolve
# libc types for Linux — not the host platform (e.g. macOS).
# cargo build/test already happen inside a Linux container.
target = "aarch64-unknown-linux-gnu"

[target.x86_64-unknown-linux-gnu]
linker = "x86_64-linux-gnu-gcc"

[target.'cfg(target_os = "linux")']
runner = "unshare -r --user --mount"

[env]
PKG_CONFIG_ALLOW_CROSS = "1"
